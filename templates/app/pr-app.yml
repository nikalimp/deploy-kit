# PR агента в сервисе или админке: проверка → автослияние → выкладка (deploy-kit pr.yml + app.yml).
# Апрува Ника нет (20.11.2026): любой PR из claude/* с зелёным check сливается сам, миграции — тоже. Миграция должна быть обратимой.
# Значения with: у job deploy — те же, что в deploy.yml сервиса.
name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency: { group: "pr-${{ github.event.pull_request.number }}", cancel-in-progress: true }
jobs:
  pr:
    permissions: { contents: write, pull-requests: write }
    uses: nikalimp/deploy-kit/.github/workflows/pr.yml@main
    with:
      site_dir: "."
  deploy:
    needs: pr
    if: needs.pr.outputs.merged == 'true'
    concurrency: { group: deploy, cancel-in-progress: false }
    permissions: { contents: read, packages: write }
    uses: nikalimp/deploy-kit/.github/workflows/app.yml@main
    with:
      ref: main
      adapter: vps-compose
      url: https://app.example.ru
    secrets: inherit
