# deploy-kit — общий сценарий выкладки всех сайтов Ника (reusable workflow).
# Живёт в репозитории nikalimp/deploy-kit. Проекты вызывают его по @main (без тега, с 23.10.2026) из своего .github/workflows/deploy.yml.
# Стандарт — «Публикация — стандарт» и «Хостинги — что проверено» (NikitOS).
#
# Адаптер по умолчанию — ssh-ftp: три пути выкладки по убыванию.
#   1. SSH (rsync)  — шаг id: ssh, continue-on-error. Одно соединение на попытку, 2 попытки.
#   2. FTP          — только если SSH не прошёл. SamKirkland/FTP-Deploy-Action, protocol ftp, без clean-slate.
#   3. Вручную с Mac — scripts/deploy-<app>.sh (rsync по SSH с ключом ~/.ssh/<project>_deploy).
#      Сборка всегда лежит артефактом workflow (site-build) — её можно скачать.
# Workflow падает, только если не сработали SSH и FTP. Последний шаг — сайт отвечает 200.
# Другие адаптеры: ftp (только FTP), s3 (Yandex Object Storage и любой S3), manual-zip, tilda.
#
# Тест и прод параллельно (с 2.0.0, 20.11.2026; стандарт — раздел «Тест и прод параллельно»):
#   вход target: test | prod. Адрес, папка выкладки и индексация берутся из publish.json → targets.<цель>:
#     "targets": { "test": { "url": "https://client.nikalimp.ru", "ftp_dir_secret": "FTP_DIR",      "indexable": false },
#                  "prod": { "url": "https://client.ru",           "ftp_dir_secret": "FTP_DIR_PROD", "indexable": true } }
#   Перед сборкой — SITE_URL (боевой домен, если есть targets.prod, иначе адрес цели), SITE_TARGET, SITE_INDEXABLE
#   и они же с префиксом NEXT_PUBLIC_. После `npm run check` — shared/target-build.mjs: тест закрыт от поисковиков
#   (noindex, robots.txt Disallow: /, без Метрики и верификаций), прод — обычный боевой сайт. Потом проверка цели:
#   главная, sitemap.xml, robots.txt, llms.txt — 200, несуществующая страница — 404, noindex есть только на тесте.
#   Нет targets.prod или секрета его папки — цель prod пропускается (выход skipped=true).
#   FTP-логин и пароль общие (FTP_HOST, FTP_USER, FTP_PASS), разные только папки (секреты из ftp_dir_secret).
#   Без входа target (старые deploy.yml) — всё как до 2.0.0: адрес из входа url, папка из FTP_DIR, сборка без правок.
#
# Вызывающий workflow обязан дать job права: permissions: { contents: write } — иначе запуск падает со startup_failure
# («nested job 'deploy' is requesting 'contents: write', but is only allowed 'contents: read'»).
# Доступ из других репозиториев: deploy-kit → Settings → Actions → General → Access →
# «Accessible from repositories owned by the user».
name: site

on:
  workflow_call:
    inputs:
      runner:        { type: string, default: "ubuntu-24.04" }  # self-hosted — свой раннер (Mac): не тратит минуты Actions
      adapter:       { type: string, default: "ssh-ftp" }  # ssh-ftp | ftp | s3 | manual-zip | tilda (ssh-rsync = ssh-ftp)
      site_dir:      { type: string, default: "." }        # папка приложения в репозитории (монорепо: apps/site)
      out_dir:       { type: string, default: "out" }      # папка сборки внутри site_dir (Next.js export — out, Vite — dist)
      app_path:      { type: string, default: "" }         # подпапка на сервере внутри SITE_DIR / FTP_DIR, со слешем: "test/app/"
      rsync_exclude: { type: string, default: "" }         # что выкладка не трогает: подпапки других приложений ("test/") и файлы, живущие только на сервере ("api/config.php api/logs/")
      url:           { type: string, default: "" }         # адрес сайта для проверки (без app_path)
      media_brand:   { type: string, default: "content/factory/brand.json" }
      node_version:  { type: string, default: "22" }
      noindex:       { type: string, default: "" }         # устарело с 21.10.2026, не используется — оставлено, чтобы старые deploy.yml не падали
      build_command: { type: string, default: "" }         # пусто — npm run check, если он есть, иначе npm run build
      ref:           { type: string, default: "" }         # ветка для выкладки; из pr.yml после автослияния — main
      server_config: { type: string, default: "" }         # путь на сервере для настроек формы из секретов LEAD_*, напр. "api/config.php" (PHP-массив); добавь его в rsync_exclude
      pagespeed:     { type: string, default: "90" }       # порог мобильного Lighthouse Performance; ниже — предупреждение и сводка (стандарт §6.6); "" — не мерить
      target:        { type: string, default: "" }         # test | prod — цель из publish.json → targets; пусто — как до 2.0.0 (url и FTP_DIR)
      publish_json:  { type: string, default: "publish.json" } # паспорт публикации от корня репозитория
      kit_ref:       { type: string, default: "main" }     # ветка deploy-kit, откуда берётся shared/target-build.mjs (для проверки ветки deploy-kit)
    outputs:
      skipped:
        description: "true — цели нет в publish.json или нет секрета её папки: выкладки не было"
        value: ${{ jobs.plan.outputs.skipped }}
      sha:
        description: "коммит, который собран и выложен, — по нему выкладывается прод"
        value: ${{ jobs.plan.outputs.sha }}
      url:
        description: "адрес цели"
        value: ${{ jobs.plan.outputs.url }}
    secrets:
      # Секреты — всегда по одному на значение (стандарт «Публикация» §5б). При secrets: inherit берутся сами по префиксу:
      #   NEXT_PUBLIC_* → .env.production.local для сборки;  LEAD_* → api/config.php на сервере (LEAD_TG_TOKEN → 'tg_token').
      # Проекту, который передаёт секреты списком, — объявленные ниже.
      NEXT_PUBLIC_PSI_KEY: { required: false }
      LEAD_EMAIL_TO: { required: false }
      LEAD_EMAIL_FROM: { required: false }
      LEAD_TG_TOKEN: { required: false }
      LEAD_TG_CHAT: { required: false }
      LEAD_SALT: { required: false }
      BUILD_ENV: { required: false }  # устарело с 14.11.2026: несколько значений в одном секрете — замени на отдельные NEXT_PUBLIC_*
      SSH_KEY: { required: false }
      SSH_HOST: { required: false }
      SSH_USER: { required: false }
      SITE_DIR: { required: false }          # абсолютный путь, со слешем: /var/www/uXXXX/data/www/<домен>/
      SSH_KNOWN_HOSTS: { required: false }
      FTP_HOST: { required: false }
      FTP_USER: { required: false }
      FTP_PASS: { required: false }
      FTP_DIR: { required: false }           # относительно корня FTP; слеш на конце добавится сам. REG.RU (основной аккаунт): www/<домен>/
      FTP_DIR_PROD: { required: false }      # папка прода (targets.prod.ftp_dir_secret), напр. www/client.ru/
      SITE_DIR_PROD: { required: false }     # абсолютная папка прода для SSH (targets.prod.ssh_dir_secret), если SSH из Actions работает
      S3_BUCKET: { required: false }
      S3_ACCESS_KEY_ID: { required: false }
      S3_SECRET_ACCESS_KEY: { required: false }
      S3_ENDPOINT: { required: false }       # по умолчанию https://storage.yandexcloud.net
      S3_REGION: { required: false }         # по умолчанию ru-central1
      TELEGRAM_BOT_TOKEN: { required: false }
      TELEGRAM_CHAT_ID: { required: false }
      TELEGRAPH_TOKEN: { required: false }   # не используется с 22.10.2026 (Instant View убран), оставлен для старых deploy.yml
      MAX_BOT_TOKEN: { required: false }
      MAX_CHAT_ID: { required: false }
      NOTIFY_BOT_TOKEN: { required: false }  # бот Ника для сообщений об ошибках выкладки
      NOTIFY_CHAT_ID: { required: false }

jobs:
  # Цель выкладки: адрес, секреты папок, индексация — из publish.json. Секреты здесь только проверяются на наличие.
  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skipped: ${{ steps.plan.outputs.skipped }}
      mode: ${{ steps.plan.outputs.mode }}
      url: ${{ steps.plan.outputs.url }}
      site_url: ${{ steps.plan.outputs.site_url }}
      aliases: ${{ steps.plan.outputs.aliases }}
      indexable: ${{ steps.plan.outputs.indexable }}
      primary: ${{ steps.plan.outputs.primary }}
      ftp_secret: ${{ steps.plan.outputs.ftp_secret }}
      ssh_secret: ${{ steps.plan.outputs.ssh_secret }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "${{ inputs.ref }}"
          sparse-checkout: ${{ inputs.publish_json }}
          sparse-checkout-cone-mode: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Цель выкладки
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          PJ: ${{ inputs.publish_json }}
          URL_IN: ${{ inputs.url }}
          ADAPTER: ${{ inputs.adapter }}
          ALL: ${{ toJSON(secrets) }}
        run: |
          node -e '
            const fs=require("fs"), out=[], set=(k,v)=>out.push(`${k}=${v}`);
            const t=process.env.TARGET, secrets=JSON.parse(process.env.ALL||"{}"), has=n=>!!(secrets[n]||"").trim();
            let p={}; try{p=JSON.parse(fs.readFileSync(process.env.PJ,"utf8"))}catch{}
            const T=p.targets&&typeof p.targets==="object"?p.targets:null, strip=u=>String(u||"").replace(/\/+$/,"");
            const legacy=()=>{set("mode","legacy");set("url",process.env.URL_IN);set("site_url","");set("aliases","");set("indexable","");set("primary","true");set("ftp_secret","FTP_DIR");set("ssh_secret","SITE_DIR");set("skipped","false");};
            if(!t) legacy();
            else if(!["test","prod"].includes(t)){console.log(`::error::target=${t}: нужно test или prod`);process.exit(1);}
            else if(!T){
              if(t==="prod"){set("skipped","true");console.log("::notice::В publish.json нет targets — выкладка на прод пропущена");}
              else {legacy();console.log("::notice::В publish.json нет targets — выкладка как до 2.0.0 (url и FTP_DIR)");}
            } else if(!T[t]||!T[t].url){
              set("skipped","true");console.log(`::notice::В publish.json нет targets.${t} — выкладка на ${t} пропущена`);
            } else {
              const x=T[t], url=strip(x.url), prod=T.prod&&T.prod.url?strip(T.prod.url):"";
              const ftp=x.ftp_dir_secret||(t==="prod"?"FTP_DIR_PROD":"FTP_DIR"), ssh=x.ssh_dir_secret||(t==="prod"?"SITE_DIR_PROD":"SITE_DIR");
              const indexable=typeof x.indexable==="boolean"?x.indexable:t==="prod";
              const siteUrl=prod||url, aliases=Object.values(T).map(y=>strip(y&&y.url)).filter(u=>u&&u!==siteUrl);
              const needsDir=["ssh-ftp","ssh-rsync","ftp"].includes(process.env.ADAPTER);
              if(t==="prod"&&needsDir&&!has(ftp)&&!has(ssh)){
                set("skipped","true");set("missing",ftp);
                console.log(`::warning::Нет секрета ${ftp} (папка прода) — выкладка на прод пропущена. Ник добавляет его в Settings → Secrets → Actions`);
              } else {
                set("skipped","false");set("mode","target");set("url",url);set("site_url",siteUrl);set("aliases",aliases.join(" "));
                set("indexable",String(indexable));set("primary",String(t==="prod"||!prod));set("ftp_secret",ftp);set("ssh_secret",ssh);
                console.log(`::notice::Цель ${t}: ${url} · ${indexable?"индексируется":"закрыта от поисковиков"} · canonical ${siteUrl} · папка из секрета ${ftp}`);
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,out.join("\n")+"\n");
          '
      - name: Сообщить Нику — нет секрета прода
        if: steps.plan.outputs.missing != ''
        env:
          T: ${{ secrets.NOTIFY_BOT_TOKEN }}
          C: ${{ secrets.NOTIFY_CHAT_ID }}
          MISSING: ${{ steps.plan.outputs.missing }}
        run: |
          [ -z "$T" ] && exit 0
          curl -s "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" \
            --data-urlencode text="⚠️ ${GITHUB_REPOSITORY}: прод не выложен — нет секрета $MISSING (папка прода). Тест обновлён. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

  deploy:
    needs: plan
    if: needs.plan.outputs.skipped != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60 # первая заливка крупного раздела (1000+ новых страниц) по rsync идёт дольше 25 минут
    permissions:
      contents: write
    env:
      MEDIA_BRAND: ${{ inputs.media_brand }}
      SSH_FIRST: ${{ inputs.adapter == 'ssh-ftp' || inputs.adapter == 'ssh-rsync' }}
      MODE: ${{ needs.plan.outputs.mode }}             # legacy — как до 2.0.0; target — цель из publish.json
      TARGET_URL: ${{ needs.plan.outputs.url }}
      INDEXABLE: ${{ needs.plan.outputs.indexable }}   # false — тест: noindex, robots Disallow, без счётчиков
      PRIMARY: ${{ needs.plan.outputs.primary }}       # true — с этой цели уходят IndexNow, каналы и PageSpeed
    defaults:
      run:
        working-directory: ${{ inputs.site_dir }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 50, ref: "${{ needs.plan.outputs.sha }}" }

      # Папки цели — из секретов, имена которых дал plan (FTP_DIR / FTP_DIR_PROD; SITE_DIR / SITE_DIR_PROD для SSH).
      # Значения идут в окружение следующих шагов; в журнале Actions их скрывает маска секретов.
      - name: Папки выкладки
        if: inputs.adapter != 'tilda'
        env:
          ALL: ${{ toJSON(secrets) }}
          FTP_NAME: ${{ needs.plan.outputs.ftp_secret }}
          SSH_NAME: ${{ needs.plan.outputs.ssh_secret }}
        run: |
          node -e '
            const a=JSON.parse(process.env.ALL||"{}"), v=n=>String(a[n]||"").trim();
            require("fs").appendFileSync(process.env.GITHUB_ENV,`TARGET_FTP_DIR=${v(process.env.FTP_NAME)}\nTARGET_SITE_DIR=${v(process.env.SSH_NAME)}\n`);
          '

      # Сборка под цель: адрес и индексация известны коду сайта (Next.js — через NEXT_PUBLIC_*). Только для входа target.
      - name: Цель сборки (SITE_URL, SITE_TARGET, SITE_INDEXABLE)
        if: env.MODE == 'target'
        env:
          SITE_URL: ${{ needs.plan.outputs.site_url }}
          TARGET: ${{ inputs.target }}
        run: |
          {
            echo "SITE_URL=$SITE_URL"; echo "SITE_TARGET=$TARGET"; echo "SITE_INDEXABLE=$INDEXABLE"; echo "SITE_DEPLOY_URL=$TARGET_URL"
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"; echo "NEXT_PUBLIC_SITE_TARGET=$TARGET"; echo "NEXT_PUBLIC_SITE_INDEXABLE=$INDEXABLE"
          } >> "$GITHUB_ENV"
          echo "::notice::Сборка «$TARGET»: SITE_URL=$SITE_URL, индексация — $INDEXABLE"

      - name: Tilda — выкладку делает Tilda MCP
        if: inputs.adapter == 'tilda'
        run: echo "Адаптер tilda — статьи хранятся в git, выпуск в поток Tilda делает задача через Tilda MCP. Сборки нет."

      - uses: actions/setup-node@v5
        if: inputs.adapter != 'tilda'
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.site_dir }}/package-lock.json

      - if: inputs.adapter != 'tilda'
        run: npm ci

      - name: Медиа статей (обложки, скриншоты, инфографика)
        if: inputs.adapter != 'tilda'
        run: |
          specs=$(find content/media -maxdepth 1 -name "*.json" ! -name channels.json 2>/dev/null | head -1)
          if [ -f scripts/media.mjs ] && [ -n "$specs" ]; then
            # журналы Actions из облачной сессии не читаются — причина падения уходит в аннотации и сводку
            fail() { echo "::error::media: $1"; tail -15 /tmp/media.log | while IFS= read -r l; do echo "::error::media: $l"; done
                     { echo "### media: $1"; echo '```'; tail -30 /tmp/media.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
            npx playwright install --with-deps chromium > /tmp/media.log 2>&1 || fail "playwright install упал"
            node scripts/media.mjs --brand "$MEDIA_BRAND" 2>&1 | tee /tmp/media.log; [ "${PIPESTATUS[0]}" = 0 ] || fail "media.mjs упал"
          else
            echo "Нет медиа статей — пропускаю"
          fi

      - name: Общие проверки — свежие скрипты из deploy-kit
        if: inputs.adapter != 'tilda'
        run: |
          # Скрипт с меткой «@nikitos-shared <имя>» в первых строках берётся из deploy-kit/shared — одна версия на все проекты.
          # deploy-kit недоступен (приватный) — остаётся копия проекта.
          for f in scripts/*.mjs scripts/*.py; do
            [ -f "$f" ] || continue
            name=$(head -5 "$f" | grep -o "@nikitos-shared [a-z0-9.-]*" | cut -d" " -f2) || true
            [ -n "$name" ] || continue
            if curl -fsSL --max-time 20 "https://raw.githubusercontent.com/nikalimp/deploy-kit/main/shared/$name" -o "/tmp/$name"; then
              cmp -s "/tmp/$name" "$f" || { cp "/tmp/$name" "$f"; echo "::notice::$f обновлён из deploy-kit/shared"; }
            else echo "deploy-kit/shared/$name недоступен — копия проекта"; fi
          done

      # Отдельный шаг: все секреты видит только он, в сборку (npm) попадают лишь NEXT_PUBLIC_* — публичные ключи браузера.
      - name: Ключи сборки (секреты NEXT_PUBLIC_*)
        if: inputs.adapter != 'tilda'
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          node -e '
            const a=JSON.parse(process.env.ALL||"{}"), k=Object.keys(a).filter(x=>x.startsWith("NEXT_PUBLIC_")&&a[x]);
            if(k.length){require("fs").appendFileSync(".env.production.local",k.map(x=>x+"="+a[x]).join("\n")+"\n");console.log("::notice::Ключи сборки: "+k.join(", "));}
          '

      - name: Проверка и сборка
        if: inputs.adapter != 'tilda'
        env:
          BUILD: ${{ inputs.build_command }}
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -n "$BUILD_ENV" ]; then printf '%s\n' "$BUILD_ENV" >> .env.production.local; echo "::warning::BUILD_ENV устарел — разложи значения по отдельным секретам NEXT_PUBLIC_*"; fi
          if [ -n "$BUILD" ]; then eval "$BUILD"
          elif npm run | grep -q "^  check$"; then npm run check
          else npm run build; fi

      # Тест закрывается от поисковиков после строгой проверки: check идёт по обычной сборке, правится уже готовая папка.
      - name: Сборка под цель (shared/target-build.mjs)
        if: env.MODE == 'target' && inputs.adapter != 'tilda'
        env:
          KIT_REF: ${{ inputs.kit_ref }}
          OUT: ${{ inputs.out_dir }}
          TARGET: ${{ inputs.target }}
          SITE_URL_C: ${{ needs.plan.outputs.site_url }}
          ALIASES: ${{ needs.plan.outputs.aliases }}
        run: |
          curl -fsSL --max-time 30 "https://raw.githubusercontent.com/nikalimp/deploy-kit/$KIT_REF/shared/target-build.mjs" -o "$RUNNER_TEMP/target-build.mjs" \
            || { echo "::error::Не скачался deploy-kit/shared/target-build.mjs — без него тест нельзя закрыть от поисковиков"; exit 1; }
          node "$RUNNER_TEMP/target-build.mjs" --out "$OUT" --target "$TARGET" --indexable "$INDEXABLE" --site-url "$SITE_URL_C" --alias "$ALIASES"

      - name: IndexNow — что изменилось
        if: inputs.adapter != 'tilda' && env.INDEXABLE != 'false' && env.PRIMARY == 'true'
        run: |
          if [ -f scripts/indexnow.mjs ]; then node scripts/indexnow.mjs prepare; else echo "нет indexnow.mjs"; fi

      # Сборка доступна артефактом — для ручной выкладки (план 3) и для manual-zip.
      # Необязательный шаг: кончилось хранилище Actions — выкладка всё равно идёт (05.11 лимит 500 МБ остановил 7 выкладок подряд).
      # Хранится 1 день: архив нужен только сразу после сборки, а место общее на все репозитории аккаунта.
      - uses: actions/upload-artifact@v4
        if: inputs.adapter != 'tilda'
        continue-on-error: ${{ inputs.adapter != 'manual-zip' }}
        with:
          # у теста и прода в одном запуске — свои имена: site-build-test, site-build-prod
          name: site-build${{ inputs.target != '' && format('-{0}', inputs.target) || '' }}
          path: ${{ inputs.site_dir }}/${{ inputs.out_dir }}
          retention-days: 1

      # ── 1. SSH (rsync). REG.RU обрывает частые подключения с одного IP: без ssh-keyscan и пробного входа,
      #       ровно одно соединение на попытку. Не прошло — предупреждение и выход 1, дальше FTP.
      - name: Выкладка — SSH (rsync)
        id: ssh
        if: env.SSH_FIRST == 'true'
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ env.TARGET_SITE_DIR }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_PATH: ${{ inputs.app_path }}
          EXCLUDE: ${{ inputs.rsync_exclude }}
          OUT: ${{ inputs.out_dir }}
        run: |
          [ -z "$SSH_KEY" ] || [ -z "$SITE_DIR" ] && { echo "::warning::Нет SSH_KEY или папки цели для SSH — пробуем FTP"; exit 1; }
          # ключ — во временной папке раннера: на своём Mac не трогаем ~/.ssh
          KEY="${RUNNER_TEMP:-$HOME/.ssh}/deploy_key"; mkdir -p ~/.ssh "$(dirname "$KEY")"; echo "$SSH_KEY" > "$KEY"; chmod 600 "$KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] && echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          DEST="${SITE_DIR%/}/${APP_PATH}"
          EX=(--exclude '.well-known/' --exclude 'cgi-bin/' --exclude '.ftp-deploy-sync-state.json')
          for d in $EXCLUDE; do EX+=(--exclude "$d"); done
          SSH="ssh -i $KEY -o ConnectTimeout=25 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15"
          for i in 1 2; do
            # --delete действует только внутри DEST: подпапки других приложений защищены --exclude
            if rsync -az --delete --stats "${EX[@]}" --rsync-path="mkdir -p '$DEST' && rsync" -e "$SSH" "$OUT/" "$SSH_USER@$SSH_HOST:$DEST"; then
              echo "::notice::Выкладка: SSH (rsync) → $DEST"; echo "- ✓ выкладка по SSH (rsync)" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "SSH: попытка $i не прошла"; [ $i -lt 2 ] && sleep 20
          done
          echo "::warning::SSH до $SSH_HOST не прошёл (REG.RU закрывает порт 22 для IP GitHub Actions) — пробуем FTP"
          exit 1

      # ── 2. FTP: если SSH не прошёл (ssh-ftp) или адаптер ftp. Не очищает сервер целиком (dangerous-clean-slate: false):
      #       .ftp-deploy-sync-state.json на сервере хранит, что уже залито, — дальше переносится только изменённое.
      # FTP-Deploy-Action требует server-dir со слешем на конце: секрет FTP_DIR без слеша («www/site.ru») ронял выкладку.
      # Нормализуем здесь, а не в секрете: путь — через GITHUB_ENV (outputs с секретом Actions не передаёт).
      - name: FTP — папка на сервере
        if: inputs.adapter == 'ftp' || (env.SSH_FIRST == 'true' && steps.ssh.outcome == 'failure')
        env:
          FTP_DIR: ${{ env.TARGET_FTP_DIR }}
          APP_PATH: ${{ inputs.app_path }}
        run: |
          [ "$MODE" = "target" ] && [ -z "$FTP_DIR" ] && { echo "::error::Пустой секрет папки FTP для цели — выкладка в корень FTP запрещена"; exit 1; }
          d="${FTP_DIR:-./}"; [ "${d%/}" = "$d" ] && d="$d/"
          a="$APP_PATH"; [ -n "$a" ] && [ "${a%/}" = "$a" ] && a="$a/"
          echo "FTP_SERVER_DIR=$d$a" >> "$GITHUB_ENV"

      - name: Выкладка — FTP
        if: inputs.adapter == 'ftp' || (env.SSH_FIRST == 'true' && steps.ssh.outcome == 'failure')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ${{ inputs.site_dir }}/${{ inputs.out_dir }}/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**
            cgi-bin/**

      - name: Путь выкладки — FTP
        if: inputs.adapter == 'ftp' || (env.SSH_FIRST == 'true' && steps.ssh.outcome == 'failure')
        run: |
          echo "::notice::Выкладка: FTP (SSH не прошёл или адаптер ftp)"
          echo "- ✓ выкладка по FTP" >> "$GITHUB_STEP_SUMMARY"

      # ── Настройки формы на сервере: отдельные секреты LEAD_* → PHP-массив в inputs.server_config (LEAD_TG_TOKEN → 'tg_token').
      #    Файл не попадает ни в git, ни в артефакт site-build (публичный репозиторий) — только на сервер, тем же путём, что выкладка.
      - name: Настройки формы на сервере (секреты LEAD_*)
        if: inputs.server_config != '' && (inputs.adapter == 'ftp' || env.SSH_FIRST == 'true')
        env:
          ALL: ${{ toJSON(secrets) }}
          TARGET: ${{ inputs.server_config }}
          SSH_OK: ${{ steps.ssh.outcome == 'success' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ env.TARGET_SITE_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ env.TARGET_FTP_DIR }}
          APP_PATH: ${{ inputs.app_path }}
        run: |
          F="${RUNNER_TEMP}/server-config.php"
          node -e '
            const a=JSON.parse(process.env.ALL||"{}"), k=Object.keys(a).filter(x=>x.startsWith("LEAD_")&&a[x]);
            if(!k.length){console.log("::warning::Нет секретов LEAD_* — "+process.env.TARGET+" на сервере не обновлён");process.exit(0);}
            const q=v=>"\x27"+String(v).replace(/\\/g,"\\\\").replace(/\x27/g,"\\\x27")+"\x27";
            const body=k.map(x=>"  "+q(x.slice(5).toLowerCase())+" => "+q(a[x].trim())+",").join("\n");
            require("fs").writeFileSync(process.argv[1],"<?php\n// Сгенерировано deploy-kit из секретов LEAD_*. Правки — в секретах репозитория, не здесь.\nreturn [\n"+body+"\n];\n");
            console.log("::notice::Настройки формы: "+k.join(", "));
          ' "$F"
          [ -f "$F" ] || exit 0
          if [ "$SSH_OK" = "true" ]; then
            KEY="${RUNNER_TEMP:-$HOME/.ssh}/deploy_key"
            scp -i "$KEY" -o BatchMode=yes "$F" "$SSH_USER@$SSH_HOST:${SITE_DIR%/}/${APP_PATH}${TARGET}" && echo "::notice::$TARGET обновлён по SSH"
          else
            d="${FTP_DIR:-}"; [ -n "$d" ] && [ "${d%/}" = "$d" ] && d="$d/"
            curl -sS --ftp-create-dirs -T "$F" --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/${d}${APP_PATH}${TARGET}" && echo "::notice::$TARGET обновлён по FTP"
          fi
          rm -f "$F"

      - name: Выкладка — s3 (Yandex Object Storage)
        if: inputs.adapter == 's3'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION || 'ru-central1' }}
          ENDPOINT: ${{ secrets.S3_ENDPOINT || 'https://storage.yandexcloud.net' }}
          BUCKET: ${{ secrets.S3_BUCKET }}
          OUT: ${{ inputs.out_dir }}
          APP_PATH: ${{ inputs.app_path }}
        run: |
          [ -z "$BUCKET" ] && { echo "::error::Нет секрета S3_BUCKET"; exit 1; }
          # HTML — короткий кэш, остальное — год (имена файлов сборки содержат хэш)
          aws s3 sync "$OUT/" "s3://$BUCKET/$APP_PATH" --endpoint-url "$ENDPOINT" --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync "$OUT/" "s3://$BUCKET/$APP_PATH" --endpoint-url "$ENDPOINT" --delete --exclude "*" --include "*.html" --cache-control "public,max-age=300"

      - name: manual-zip — сборка в артефакте site-build
        if: inputs.adapter == 'manual-zip'
        run: echo "Скачай артефакт site-build в этом запуске и залей в панель хостинга (или scripts/deploy-<app>.sh с Mac)."

      - name: Сайт отвечает
        if: env.TARGET_URL != '' && inputs.adapter != 'manual-zip' && inputs.adapter != 'tilda'
        env:
          URL: ${{ env.TARGET_URL }}
          APP_PATH: ${{ inputs.app_path }}
        run: |
          U="${URL%/}/${APP_PATH}"
          for _ in 1 2 3; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "$U" || true)
            echo "$U: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          echo "::error::Сайт ответил $code"; exit 1

      # Проверка цели после выкладки (вход target): красная — следующая цель не выкладывается, Нику — сообщение.
      - name: Проверка цели — страницы, 404, индексация
        if: env.MODE == 'target' && env.TARGET_URL != '' && inputs.adapter != 'manual-zip' && inputs.adapter != 'tilda'
        env:
          APP_PATH: ${{ inputs.app_path }}
          TARGET: ${{ inputs.target }}
        run: |
          U="${TARGET_URL%/}/${APP_PATH}"; U="${U%/}"; bad=0
          get() { curl -sk -o "$2" -w "%{http_code}" --max-time 25 -H "Cache-Control: no-cache" "$1" || echo 000; }
          for p in / /sitemap.xml /robots.txt /llms.txt; do
            c=$(get "$U$p?nocache=$GITHUB_RUN_ID" /tmp/page); echo "$U$p: $c"
            [ "$c" = "200" ] || { echo "::error::$TARGET: $U$p ответил $c (нужно 200)"; bad=1; }
            [ "$p" = "/" ] && cp /tmp/page /tmp/home.html
            [ "$p" = "/robots.txt" ] && cp /tmp/page /tmp/robots.txt
          done
          c=$(get "$U/nikitos-404-check-$GITHUB_RUN_ID/" /tmp/page); echo "404-проверка: $c"
          [ "$c" = "404" ] || { echo "::error::$TARGET: несуществующая страница ответила $c (нужно 404)"; bad=1; }
          if grep -qiE '<meta[^>]+name="?robots"?[^>]+noindex' /tmp/home.html 2>/dev/null; then noindex=true; else noindex=false; fi
          if [ "$INDEXABLE" = "false" ]; then
            [ "$noindex" = "true" ] || { echo "::error::$TARGET: на главной нет noindex — тест открыт поисковикам"; bad=1; }
            grep -qE '^Disallow:[[:space:]]*/[[:space:]]*$' /tmp/robots.txt || { echo "::error::$TARGET: robots.txt не закрывает сайт"; bad=1; }
          else
            [ "$noindex" = "false" ] || { echo "::error::$TARGET: на главной noindex — боевой сайт закрыт от поисковиков"; bad=1; }
          fi
          [ "$bad" = 0 ] && { echo "::notice::Проверка $TARGET пройдена: страницы 200, 404 на месте, noindex — $noindex"; echo "- ✓ проверка $TARGET ($U): 200, 404, noindex=$noindex" >> "$GITHUB_STEP_SUMMARY"; }
          exit "$bad"

      - name: PageSpeed (мобильный Lighthouse)
        if: env.TARGET_URL != '' && env.PRIMARY == 'true' && inputs.pagespeed != '' && inputs.adapter != 'manual-zip' && inputs.adapter != 'tilda'
        continue-on-error: true
        env:
          URL: ${{ env.TARGET_URL }}
          APP_PATH: ${{ inputs.app_path }}
          MIN: ${{ inputs.pagespeed }}
        run: |
          U="${URL%/}/${APP_PATH}"
          CH=$(command -v google-chrome || command -v chromium || true)
          npx --yes lighthouse@12 "$U" --quiet --form-factor=mobile --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/lh.json --chrome-path="$CH" --chrome-flags="--headless=new --no-sandbox" >/dev/null 2>&1 || { echo "::warning::PageSpeed: Lighthouse не запустился"; exit 0; }
          # shellcheck disable=SC2016
          node -e '
            const r=require("/tmp/lh.json"), c=r.categories, s=k=>Math.round((c[k]?.score||0)*100), a=r.audits;
            const perf=s("performance"), min=+process.env.MIN;
            const line=`PageSpeed mobile: Performance ${perf}, Accessibility ${s("accessibility")}, Best Practices ${s("best-practices")}, SEO ${s("seo")} · LCP ${a["largest-contentful-paint"]?.displayValue} · CLS ${a["cumulative-layout-shift"]?.displayValue} · TBT ${a["total-blocking-time"]?.displayValue}`;
            const top=Object.values(a).filter(x=>x.details?.type==="opportunity"&&x.score!==null&&x.score<0.9).sort((x,y)=>(y.numericValue||0)-(x.numericValue||0)).slice(0,5);
            // топ-3 причины — прямо в аннотации: недельному аудиту не нужно перезапускать Lighthouse
            const why=top.slice(0,3).map(x=>`${x.title}${x.displayValue?` (${x.displayValue})`:""}`).join("; ");
            console.log((perf<min?"::warning::":"::notice::")+line+(perf<min?` — ниже ${min}, задача на исправление (стандарт §6.6). Причины: ${why||"нет данных"}`:""));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### ${line}\n`+top.map(x=>`- ${x.title}: ${x.displayValue||""}`).join("\n")+"\n");
          '

      - name: IndexNow — отправить
        if: inputs.adapter != 'manual-zip' && inputs.adapter != 'tilda' && env.INDEXABLE != 'false' && env.PRIMARY == 'true'
        continue-on-error: true
        run: |
          if [ -f scripts/indexnow.mjs ]; then node scripts/indexnow.mjs submit || true; fi

      # Посты в каналы — один раз: с прода, а пока прода нет — с теста.
      - name: Telegram и Max
        if: inputs.adapter != 'manual-zip' && inputs.adapter != 'tilda' && env.PRIMARY == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        # итоги (что ушло в Telegram и Max, реестр) channels.mjs пишет аннотациями и в сводку запуска
        run: |
          [ -f scripts/channels.mjs ] || { echo "нет scripts/channels.mjs"; exit 0; }
          node scripts/channels.mjs --brand "$MEDIA_BRAND" || { echo "::warning::channels.mjs упал — посты в Telegram и Max не ушли"; exit 1; }

      - name: Сохранить сгенерированные файлы
        if: inputs.adapter != 'tilda'
        continue-on-error: true
        env:
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          git add public/blog content/media 2>/dev/null || true
          if git diff --cached --quiet; then echo "Нечего сохранять"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "медиа и каналы блога [skip ci]"
          # --autostash: сборка меняет отслеживаемые файлы (отчёт geo-check за день, типограф) — без него pull --rebase
          # отказывает, и реестр каналов не сохраняется: следующий запуск снова шлёт ту же статью в Telegram.
          BR="${REF:-$GITHUB_REF_NAME}"
          # прод выкладывается по коммиту (sha) — сохраняем в основную ветку
          case "$BR" in *[!0-9a-f]*|"") ;; *) [ ${#BR} -ge 7 ] && BR="$DEFAULT_BRANCH";; esac
          case "$BR" in */merge) BR="$DEFAULT_BRANCH";; esac
          for _ in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin "$BR" && git push origin "HEAD:$BR"; then
              echo "::notice::Сохранено в $BR: медиа и реестр каналов"; exit 0
            fi
            sleep 5
          done
          echo "::warning::Не удалось сохранить медиа и реестр каналов (content/media/channels.json) — следующий запуск может повторить посты"
          exit 1

      - name: Сообщить Нику об ошибке
        if: failure()
        env:
          T: ${{ secrets.NOTIFY_BOT_TOKEN }}
          C: ${{ secrets.NOTIFY_CHAT_ID }}
          TARGET: ${{ inputs.target }}
        run: |
          [ -z "$T" ] && exit 0
          case "$TARGET" in
            test) what="Тест не прошёл (выкладка или проверка) — прод не тронут";;
            prod) what="Прод: выкладка или проверка не прошла";;
            *)    what="Выкладка упала (SSH и FTP)";;
          esac
          curl -s "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" \
            --data-urlencode text="❌ $what: ${GITHUB_REPOSITORY} ${TARGET_URL} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Сборка — артефакт site-build, план 3 — scripts/deploy-*.sh с Mac." >/dev/null
