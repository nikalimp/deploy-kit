# deploy-kit — проверка и автослияние PR агента (reusable workflow). Стандарт — «Публикация — стандарт» §4.
# Решение Ника 20.11.2026: апрува Ника нет. Любой PR агента из claude/* сливается сам после зелёного check —
# в том числе правки .github/, publish.json, удаление страниц, смена URL с 301 и смена adapter. Метки needs-nik нет.
#
#   ветка claude/<задача> ─► PR ─► check (npm ci && npm run check) ─► зелёный ─► merge (GITHUB_TOKEN)
#        ─► вызывающий workflow: выкладка на тест ─► проверка теста ─► выкладка того же коммита на прод ─► проверка прода
#                                                    └─ красный ─► агент чинит в той же ветке
#
# Почему выкладка — в том же запуске: слияние токеном GITHUB_TOKEN не создаёт событие push, и deploy.yml не стартует.
# Поэтому вызывающий workflow (шаблон templates/pr.yml) запускает site.yml или app.yml сам, после job merge.
#
# Без автослияния — только то, что не от агента: ветка не claude/*, PR из форка, черновик.
# Откат: выкладка упала или проверка красная — агент открывает PR с git revert (он тоже сольётся сам), Telegram — из site.yml.
# Что остаётся за Ником: секреты (вводит только он), новые репозитории и push в чужие репозитории — после его подтверждения.
#
# Вызывающий job даёт права: permissions: { contents: write, pull-requests: write }.
name: pr

on:
  workflow_call:
    inputs:
      site_dir:      { type: string, default: "." }         # папка приложения (монорепо: apps/site)
      check_command: { type: string, default: "" }          # пусто — npm run check, если он есть, иначе npm run build
      node_version:  { type: string, default: "22" }
      manual_paths:  { type: string, default: "" }          # устарело с 2.0.0 (20.11.2026): апрува Ника нет, вход не используется — оставлен, чтобы старые pr.yml не падали
      merge_method:  { type: string, default: "squash" }    # squash | merge | rebase
    outputs:
      merged:
        description: "true — PR слит, вызывающий workflow запускает выкладку"
        value: ${{ jobs.merge.outputs.merged }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.site_dir }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.site_dir }}/package-lock.json
      - run: npm ci
      - name: Общие проверки — свежие скрипты из deploy-kit
        run: |
          for f in scripts/*.mjs scripts/*.py; do
            [ -f "$f" ] || continue
            name=$(head -5 "$f" | grep -o "@nikitos-shared [a-z0-9.-]*" | cut -d" " -f2) || true
            [ -n "$name" ] || continue
            curl -fsSL --max-time 20 "https://raw.githubusercontent.com/nikalimp/deploy-kit/main/shared/$name" -o "/tmp/$name" \
              && { cmp -s "/tmp/$name" "$f" || { cp "/tmp/$name" "$f"; echo "::notice::$f обновлён из deploy-kit/shared"; }; } \
              || echo "deploy-kit/shared/$name недоступен — копия проекта"
          done
      - name: npm run check
        env:
          CHECK: ${{ inputs.check_command }}
        run: |
          set -o pipefail
          if [ -n "$CHECK" ]; then eval "$CHECK"
          elif npm run | grep -q "^  check$"; then npm run check
          else npm run build; fi 2>&1 | tee /tmp/check.log
      - name: Итог проверки
        if: always()
        run: |
          # журналы Actions из облачной сессии не читаются — главные строки идут в аннотации и сводку
          f=$(grep -E "^✗|✗ " /tmp/check.log 2>/dev/null | head -10 || true)
          if [ -n "$f" ]; then
            while IFS= read -r l; do echo "::error::check: ${l#*✗ }"; done <<< "$f"
            { echo "### check: ошибки"; echo '```'; echo "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✓ npm run check" >> "$GITHUB_STEP_SUMMARY"
          fi

  merge:
    needs: check
    runs-on: ubuntu-24.04
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Слияние
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          METHOD: ${{ inputs.merge_method }}
        run: |
          R="$GITHUB_REPOSITORY"
          # sha — защита от гонки: пока шёл check, в ветку могли запушить ещё коммит
          gh api -X PUT "repos/$R/pulls/$N/merge" -f merge_method="$METHOD" -f sha="$SHA" >/dev/null
          gh api -X DELETE "repos/$R/git/refs/heads/$GITHUB_HEAD_REF" >/dev/null || true
          echo "::notice::PR #$N слит автоматически после зелёного check"
          echo "- ✓ PR #$N слит автоматически (check зелёный), дальше — выкладка" >> "$GITHUB_STEP_SUMMARY"
          echo "merged=true" >> "$GITHUB_OUTPUT"
